name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SterlinkIng89
          template: classic
          
          # Base limpia: solo muestra actividad general y repositorios relevantes
          base: header, activity, repositories
          base_indepth: yes
          config_timezone: America/Mexico_City
          config_order: base.header, languages, lines, achievements
          
          # Lenguajes compactos y estilizados
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          
          # Líneas de código añadidas/eliminadas
          plugin_lines: yes
          plugin_lines_history_limit: 1
          
          # Desactivamos habits e isocalendar para evitar errores y saturación visual
          plugin_habits: no
          plugin_isocalendar: no
          
          # Logros de GitHub en formato compacto
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
