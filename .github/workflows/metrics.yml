name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SterlinkIng89
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Mexico_City
          
          # 1. Languages (Most used with breakdown)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          
          # 2. Isometric Activity Calendar (Full year activity chart)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # 3. Issue & PR Follow-up Activity
          plugin_followup: yes
          plugin_followup_sections: user, repositories
          
          # 4. Starred Repositories
          plugin_stars: yes
          plugin_stars_limit: 6
          
          # 5. Achievements
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
